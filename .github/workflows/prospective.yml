name: Prospective forecast log

# Logs a primary forecast for each fixture while its kickoff is 24-26 h ahead, and a fallback while it is
# 26-32 h ahead (docs/PROSPECTIVE_PROTOCOL.md, amendment A4), and commits the log back to main.
#
# Triggers (operations, not protocol):
#   - primary: an external cron service (cron-job.org) calls workflow_dispatch every 30 minutes;
#     dispatched runs start within about a minute. Setup: docs/LOGGER_SETUP.md.
#   - backup: GitHub's own schedule below. In gameweek 10 GitHub started these only every 4-8 h,
#     so they are a safety net, not the main trigger.
# Each log run also refreshes the results file once a UTC day and archives football-data's fixtures.csv
# at most hourly (amendment A6; odds are a benchmark only), inside the same job: no extra runs.
# Extra runs are harmless: the concurrency group runs one job at a time, a queued job checks out main
# after the previous one has pushed, and log_due() re-reads the log before appending.
# Budget: 48 dispatched runs/day (~1,440 min/month) + at most 12 backup runs/day (~360) is within the
# 2,000 private-repo minutes of GitHub Free. Most runs find nothing due and bill one minute.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "log | dry-run | check-sources | score | warm (full forecast, nothing committed) | odds-api (one test call, 2 credits)"
        type: choice
        options: [log, dry-run, check-sources, score, warm, odds-api]
        default: log

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: prospective-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'log' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make sure the log is the latest one on main
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore downloaded data and training-row cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/fpl
            data/processed
          key: tabet-data-${{ github.run_id }}
          restore-keys: tabet-data-
      - name: Run
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # amendment A7: benchmark odds at each record's cutoff
        run: |
          case "$MODE" in
            check-sources) python -m tabet check-sources ;;
            dry-run)       python -m tabet log-forecasts --dry-run ;;
            score)         python -m tabet score-forecasts ;;
            warm)          python -m tabet forecast --gameweeks 1 ;;
            odds-api)      python -m tabet archive-odds --api ;;
            *)             python -m tabet log-forecasts ;;
          esac
      - name: Refresh the match explorer's data (daily, when a forecast was logged, or when new odds arrive)
        if: env.MODE == 'log' || env.MODE == 'score' || env.MODE == 'odds-api'
        continue-on-error: true   # the site data must never block the forecast log
        run: python -m tabet site-data --if-stale 20
      - name: Commit log
        if: env.MODE == 'log' || env.MODE == 'score' || env.MODE == 'odds-api'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective res/ results/lineup_snapshots site/data 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Prospective log: $MODE at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          python -m tabet check-log   # refuse to push if any fixture/kickoff now appears twice
          git push origin HEAD:main
      - name: Heartbeat
        if: always()
        run: |
          python -m tabet heartbeat --json > heartbeat.txt || { echo "heartbeat failed" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          sed '$d' heartbeat.txt >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 heartbeat.txt > heartbeat.json
      - name: Alert on a missed fixture or a long gap between runs
        if: always() && hashFiles('heartbeat.json') != ''
        run: |
          missed=$(jq -r '.missed | join(", ")' heartbeat.json)
          open_now=$(jq -r '.window_open_now' heartbeat.json)
          # previous successful run of this workflow (excluding this one)
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/prospective.yml/runs?status=success&per_page=5" \
                 --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].created_at // empty")
          gap_h=""
          if [ -n "$prev" ]; then gap_h=$(( ( $(date -u +%s) - $(date -u -d "$prev" +%s) ) / 3600 )); fi
          reason=""
          if [ -n "$missed" ]; then reason="Fixture(s) $missed passed their logging window without a record."; fi
          if [ "$open_now" = "true" ] && [ -n "$gap_h" ] && [ "$gap_h" -ge 3 ]; then
            reason="$reason No successful run for ${gap_h} h before this one while a logging window is open; check the external trigger."
          fi
          # amendment A6 monitoring (benchmark data; never affects forecasts)
          if [ "$(jq -r '.results_behind // false' heartbeat.json)" = "true" ]; then
            reason="$reason The local results file has been behind football-data (or failed to refresh) for 2 days in a row."
          fi
          odds_missing=$(jq -r '(.odds_missing // []) | join(", ")' heartbeat.json)
          if [ -n "$odds_missing" ]; then
            reason="$reason No odds snapshot yet for fixture(s) $odds_missing, kicking off within 24 h."
          fi
          if [ "$(jq -r '.odds_api_low // false' heartbeat.json)" = "true" ]; then
            reason="$reason The Odds API has fewer than 50 credits left this month; snapshots are paused until the 1st."
          fi
          reason="${reason# }"
          if [ -z "$reason" ]; then echo "No alert."; exit 0; fi
          title="Prospective logger alert"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq 'length' | grep -qv '^0$'; then
            num=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
            # a condition can hold for many 30-minute runs: comment only when the reason changes
            last=$(gh issue view "$num" --json comments,body --jq '(.comments | last | .body) // .body')
            if printf '%s' "$last" | grep -qF -- "$reason"; then echo "Same alert as the last comment; not repeated."; exit 0; fi
            gh issue comment "$num" \
              --body "$(date -u +%Y-%m-%dT%H:%MZ): $reason Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --title "$title" \
              --body "$(date -u +%Y-%m-%dT%H:%MZ): $reason Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
