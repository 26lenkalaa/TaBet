name: Prospective forecast log

# Logs each fixture's forecasts once, 24-26 h before kickoff (docs/PROSPECTIVE_PROTOCOL.md),
# and commits the log back to main. Most hourly runs find nothing due and finish in about a minute.
on:
  schedule:
    # Minute changed from :17 on 2026-11-05: the first schedule never fired, and editing the
    # workflow on main makes GitHub register the schedule again.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "log | dry-run | check-sources | score | warm (full forecast, nothing committed)"
        type: choice
        options: [log, dry-run, check-sources, score, warm]
        default: log

permissions:
  contents: write

concurrency:
  group: prospective-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode || 'log' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore downloaded data and training-row cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/fpl
            data/processed
          key: tabet-data-${{ github.run_id }}
          restore-keys: tabet-data-
      - name: Run
        run: |
          case "$MODE" in
            check-sources) python -m tabet check-sources ;;
            dry-run)       python -m tabet log-forecasts --dry-run ;;
            score)         python -m tabet score-forecasts ;;
            warm)          python -m tabet forecast --gameweeks 1 ;;
            *)             python -m tabet log-forecasts ;;
          esac
      - name: Commit log
        if: env.MODE == 'log' || env.MODE == 'score'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective res/ results/lineup_snapshots 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Prospective log: $MODE at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
