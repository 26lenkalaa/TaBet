name: API-Football data (training only)

# Collects multi-league match data (lineups, team and player statistics) for model training and
# stores it in the backend: raw responses in Supabase Storage (private bucket `api-football`) and
# bookkeeping in private tables (backend/supabase/migrations/0003_api_football.sql). Nothing is
# committed to git. It is separate from the forecast logger and never calls the odds or predictions
# endpoints.
#
# Budget: a run uses at most `budget` requests (including the status check) and always leaves 10 of
# the day's limit unused. fetch reads the plan from /status: on a paid plan it fetches 20 matches a
# request at a fast pace and retries seasons the free plan refused; on the free plan (100 a day) it
# fetches one match a request, 6.5 s apart. The daily run's budget of 2000 only matters on a paid
# plan; on the free plan the daily limit caps it at about 90.
# `probe`, `coverage`, `xgcheck` and other budgets can be run by hand.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (5 calls) | fetch | xgcheck (2 calls) | coverage (11 calls: what each league has by season)"
        type: choice
        options: [probe, fetch, xgcheck, coverage, injcheck, injuries]
        default: probe
      budget:
        description: "Most requests this run may use (free plan: 100 a day)"
        default: "2000"
      league:
        description: "xgcheck/injcheck: league id (39 = Premier League)"
        default: "39"
      season:
        description: "xgcheck/injcheck: season, starting year"
        default: "2022"
      ids:
        description: "coverage only: comma-separated league ids (default: the collector's list)"
        default: ""

permissions:
  contents: read

concurrency:
  group: api-football
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: "soccer (premier league)"
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MODE: ${{ inputs.mode || 'fetch' }}
      BUDGET: ${{ inputs.budget || '2000' }}
      LEAGUE: ${{ inputs.league || '39' }}
      SEASON: ${{ inputs.season || '2022' }}
      IDS: ${{ inputs.ids || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi
      - name: Run
        run: |
          set -o pipefail   # a crash must fail the run, even through tee
          python -m tabet.api_football "$MODE" --budget "$BUDGET" --league "$LEAGUE" --season "$SEASON" --ids "$IDS" | tee result.json
          { echo '```json'; cat result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
