name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "soccer (premier league)"   # the football project; other sports get their own folders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate source data
        run: python -m tabet validate

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend   # Express API + Supabase sync, shared by every sport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci   # npm workspace: installs at the repo root
        working-directory: .
      - run: npm test
      - name: Check every season converts for the database
        run: node scripts/sync-soccer.mjs --dry-run
