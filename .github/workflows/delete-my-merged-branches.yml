name: Delete my merged branches

# When a pull request merges, delete its branch, but only if 26lenkalaa opened it.
# Teammates' branches are never touched. This takes a few seconds of Actions time per merge.
# A deleted branch can be restored from its PR page ("Restore branch").
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == '26lenkalaa' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
            && echo "Deleted $BRANCH" \
            || echo "$BRANCH was already gone"
