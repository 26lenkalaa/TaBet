<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaBet</title>
<meta name="description" content="TaBet's match forecasts next to the betting market. Scroll this week's matches, last week's results and how we've done this season.">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon-tamid.png?v=2">
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="preload" href="fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* fonts served from this site (no Google round trips); licences in fonts/OFL-*.txt */
@font-face { font-family: "Press Start 2P"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/press-start-2p-latin.woff2) format("woff2"); }
@font-face { font-family: "Schibsted Grotesk"; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/schibsted-grotesk-latin.woff2) format("woff2"); }

:root {
  --bg: #F3F4F6; --card: #FFFFFF; --ink: #15181C; --muted: #5B6168; --line: #E3E5E8; --line-2: #C3C7CD;
  --dark: #111418; --dark-muted: #C9CDD3; --gold: #FFD23F; --red: #FF5A4F;
  --gap-bg: #FDEBD8; --gap-ink: #8A3D00; --win-bg: #DCE9F9; --win-ink: #0B4A8F;
  --grass-a: #2A6E38; --grass-b: #266533; --grass-edge: #1D5229;
  --px: "Press Start 2P", ui-monospace, monospace;
  --sans: "Schibsted Grotesk", system-ui, sans-serif;
  --accent: #1F7A4C;   /* set per sport tab below */
}
body[data-sport="rugby"] { --accent: #8C2340; }
body[data-sport="basketball"] { --accent: #C2531B; }
body[data-sport="american"] { --accent: #2B4C9B; }

* { box-sizing: border-box; }
html { scroll-padding-top: 160px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.px { font-family: var(--px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }

/* ---- header: stays on top as you scroll ---- */
.top { position: sticky; top: 0; z-index: 50; color: #fff; background: var(--dark);
  background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 6px 6px;
  box-shadow: 0 6px 18px rgba(0,0,0,.18); padding-top: env(safe-area-inset-top); }
.top .wrap { padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.logo .tile { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 10px; background: #fff; }
.logo .tile img { width: 34px; height: 34px; display: block; }
.logo .name { font-family: var(--px); font-size: 18px; letter-spacing: 1px; }
.right { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pages { display: flex; flex-wrap: wrap; gap: 4px; }
.pages a, .pages span { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; color: var(--dark-muted); text-decoration: none; font-size: 14px; font-weight: 500; }
.pages a:hover { color: #fff; background: rgba(255,255,255,.06); }
.pages a[aria-current="page"] { background: rgba(255,255,255,.10); color: #fff; font-weight: 600; }
.pages .soon { font-size: 11px; color: #9AA0A8; }
.searchbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.searchbtn[aria-expanded="true"] { background: rgba(255,255,255,.18); }

.search { background: var(--card); color: var(--ink); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.3); max-height: 60vh; overflow: auto; }
.search[hidden] { display: none; }
.search label { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--accent); background: var(--bg); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--ink); }
.search .hint { font-size: 14px; color: var(--muted); margin: 0; }
.search h3 { margin: 0; font-family: var(--px); font-size: 10px; font-weight: 400; color: var(--muted); }
.hits { display: grid; gap: 8px; }
.hits.teams { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.hit { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none; }
.hit:hover { border-color: var(--line-2); background: var(--bg); }
.hit .t { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; }
.hit .d { font-size: 13px; color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px 12px 0 0; background: transparent; color: var(--dark-muted); font-size: 15px; font-weight: 600; cursor: pointer; }
.tab:hover { color: #fff; }
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); box-shadow: inset 0 3px 0 var(--tab-c); }
.tab .ico { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: var(--tab-c); color: #fff; }
.tab .soon { font-size: 11px; color: #9AA0A8; }
.tab[aria-selected="true"] .soon { color: var(--muted); }
.tab[data-sport="soccer"] { --tab-c: #1F7A4C; }
.tab[data-sport="rugby"] { --tab-c: #8C2340; }
.tab[data-sport="basketball"] { --tab-c: #C2531B; }
.tab[data-sport="american"] { --tab-c: #2B4C9B; }

/* ---- page body ---- */
main { padding-top: 28px; padding-bottom: 64px; display: flex; flex-direction: column; gap: 40px; }
main[hidden] { display: none; }
.kicker { display: flex; align-items: center; gap: 10px; }
.kicker .px { font-size: 11px; color: var(--accent); }
.kicker .sub { font-size: 13px; color: var(--muted); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #2EA062; animation: pulse 1.6s ease-out infinite; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
.head h2 { margin: 6px 0 0; font-size: 24px; font-weight: 700; }
.head .note { font-size: 14px; color: var(--muted); }
.head .note strong { color: var(--ink); }
.loading, .empty { padding: 32px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-size: 15px; }

/* badges: club colours and a short code instead of crests */
.badge { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 11px; font-family: var(--px); font-size: 9px; box-shadow: inset 0 -4px 0 var(--ring); }
.badge.sm { width: 36px; height: 36px; border-radius: 10px; font-size: 8px; }
.badge.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 13px; box-shadow: inset 0 -6px 0 var(--ring); }

/* highlight match on the pitch */
.pitch { position: relative; overflow: hidden; border-radius: 24px; padding: clamp(20px, 6vw, 64px) clamp(12px, 5vw, 72px);
  background: var(--grass-edge) repeating-linear-gradient(90deg, var(--grass-a) 0 80px, var(--grass-b) 80px 160px); }
.pitch .lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pitch .lines * { fill: none; stroke: rgba(255,255,255,.55); stroke-width: 3; vector-effect: non-scaling-stroke; }
.pitch .lines .spot { fill: rgba(255,255,255,.55); stroke: none; }
.roll { position: absolute; bottom: 6%; left: -40px; width: 18px; height: 18px; pointer-events: none; animation: roll 18s linear infinite; }
.roll svg { display: block; animation: spin 1.2s steps(8) infinite; }
.feat { position: relative; max-width: 900px; margin: 0 auto; background: var(--dark); color: #fff; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 18px 40px rgba(0,0,0,.35); }
.feat .row1 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.feat h2 { margin: 0; font-size: 15px; font-weight: 500; color: var(--dark-muted); }
.timer { display: flex; align-items: center; gap: 6px; }
.timer .lbl { font-size: 12px; color: var(--dark-muted); margin-right: 4px; }
.timer .box { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; min-width: 46px; padding: 8px 6px; border-radius: 10px; background: #000; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.timer .v { font-family: var(--px); font-size: 14px; color: var(--gold); }
.timer .u { font-size: 10px; font-weight: 600; color: var(--dark-muted); letter-spacing: .5px; }
.teams3 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.side { display: flex; align-items: center; gap: 16px; min-width: 0; }
.side.away { justify-content: flex-end; text-align: right; }
.side .nm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.side.away .nm { align-items: flex-end; }
.side .team { font-size: 22px; font-weight: 700; }
.side .pct { font-family: var(--px); font-size: 28px; }
.draw { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--dark-muted); }
.draw .pct { font-family: var(--px); font-size: 18px; }
.cmp { display: flex; flex-direction: column; gap: 10px; }
.cmp .r { display: grid; grid-template-columns: 70px minmax(0, 1fr) 120px; align-items: center; gap: 12px; font-size: 13px; }
.cmp .who { font-weight: 600; }
.cmp .nums { color: var(--dark-muted); text-align: right; }
.pbar { display: flex; gap: 2px; overflow: hidden; border-radius: 5px; height: 10px; }
.pbar span { display: block; }
.pbar.big { height: 14px; border-radius: 7px; }
.pbar.mkt { opacity: .6; }
.grow { transform-origin: left center; animation: grow .9s cubic-bezier(.2,.8,.2,1) .2s both; }
.call { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,.06); }
.call .row1 .px { font-size: 10px; color: var(--gold); }
.call .row1 span:last-child { font-size: 13px; color: var(--dark-muted); }
.picks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick { min-height: 48px; padding: 0 10px; border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: transparent; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .2s ease, background .2s ease; }
.pick:hover { transform: translateY(-2px); }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.verdict { margin: 0; font-size: 14px; line-height: 1.5; animation: pop .35s ease-out both; }
.verdict[hidden] { display: none; }
.feat .foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.feat .foot p { margin: 0; font-size: 14px; color: var(--dark-muted); max-width: 52ch; }
.go { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; }

/* season strip */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font-family: var(--px); font-size: 22px; }
.tile .v small { font-family: var(--sans); font-size: 15px; color: var(--muted); }
.tile .v2 { font-size: 17px; font-weight: 600; }
.tile .v2 .px { font-size: 15px; }

/* match and result cards */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--ink); }
.legend i.o { background: #E07A1F; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; }
.reveal { display: flex; }
.card { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 0 20px 20px; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: var(--ink); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(17,20,24,.12); border-color: var(--line-2); }
.card .strip { display: flex; height: 5px; margin: 0 -20px; }
.card .strip span { flex: 1; }
.card .when { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; font-weight: 500; color: var(--muted); }
.gaptag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--gap-bg); color: var(--gap-ink); font-size: 12px; font-weight: 600; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 10px; column-gap: 12px; align-items: center; }
.pair .t { display: flex; align-items: center; gap: 12px; min-width: 0; font-size: 16px; font-weight: 500; }
.pair .t b { font-weight: 700; }
.pair .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair .pct { font-family: var(--px); font-size: 15px; color: var(--muted); }
.pair .pct.fav { color: var(--ink); }
.card .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.card .why { font-size: 13px; color: var(--gap-ink); font-weight: 500; margin: 0; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; }
.res .t { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 15px; font-weight: 600; }
.res .t.away { justify-content: flex-end; }
.score { font-family: var(--px); font-size: 18px; padding: 8px 12px; border-radius: 10px; background: var(--dark); color: #fff; }
.resfoot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.resfoot strong { color: var(--ink); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: #ECEDEF; color: #3A4048; font-size: 12px; font-weight: 600; }
.tag.won { background: var(--win-bg); color: var(--win-ink); }

/* other sports, until they have data */
.soonpanel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 48px 32px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.soonpanel .px { font-size: 12px; color: var(--accent); }
.soonpanel h2 { margin: 0; font-size: 28px; }
.soonpanel p { margin: 0; font-size: 16px; line-height: 1.5; color: var(--muted); max-width: 56ch; }
.soonpanel i { width: 120px; height: 8px; border-radius: 4px; background: var(--accent); }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.replay { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink); font-family: var(--px); font-size: 10px; cursor: pointer; }

/* ---- arcade intro (first visit only) ---- */
.intro { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; cursor: pointer; overflow: hidden; }
.intro[hidden] { display: none; }
.intro canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.intro .crt { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px), radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
.intro .ovl { position: absolute; inset: 0; pointer-events: none; font-family: var(--px); color: #fff; text-shadow: 3px 3px 0 #000; }
.intro .hud { position: absolute; top: 4%; left: 0; right: 0; display: flex; justify-content: space-around; font-size: clamp(9px, 1.6vw, 18px); }
.intro .hud .r { color: var(--red); }
.intro .big { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-size: clamp(28px, 9vw, 96px); }
.intro .msg { position: absolute; bottom: 9%; left: 0; right: 0; text-align: center; font-size: clamp(9px, 1.5vw, 16px); }
.intro .skip { position: absolute; right: 20px; bottom: 20px; z-index: 2; font-family: var(--px); font-size: 14px; color: #1c1600; background: var(--gold); border: 0; padding: 14px 18px; box-shadow: 4px 4px 0 #000; cursor: pointer; }
.blink { animation: blink 1s steps(1) infinite; }
.goal { animation: goalc .24s steps(1) infinite; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes goalc { 0% { color: var(--gold); } 33% { color: var(--red); } 66% { color: #7dd1ff; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,160,98,.6); } 100% { box-shadow: 0 0 0 10px rgba(46,160,98,0); } }
@keyframes roll { from { left: -40px; } to { left: 100%; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
/* cards slide in as they scroll into view, where the browser supports scroll-driven animation */
@supports (animation-timeline: view()) {
  .reveal { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 45%; }
  .card .pbar { transform-origin: left center; animation: grow linear both; animation-timeline: view(); animation-range: entry 20% entry 80%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .roll { display: none; }
}
@media (max-width: 640px) {
  .top .wrap { gap: 10px; }
  .tab { padding: 0 12px; font-size: 14px; }
  .side .team { font-size: 17px; }
  .side .pct { font-size: 20px; }
  .badge.lg { width: 48px; height: 48px; font-size: 10px; }
  .feat { padding: 20px; }
  .cmp .r { grid-template-columns: 56px minmax(0, 1fr); }
  .cmp .nums { grid-column: 2; text-align: left; }
  html { scroll-padding-top: 16px; }
  /* on a phone the header scrolls away, and the tabs scroll sideways instead of wrapping */
  .top { position: relative; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 0 24px; }
  .tab { flex: none; }
  .pages a, .pages span { padding: 0 10px; }
  .teams3 { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .side.away { flex-direction: row-reverse; justify-content: flex-end; text-align: left; }
  .side.away .nm { align-items: flex-start; }
  .side .nm { flex-direction: row; align-items: baseline; justify-content: space-between; flex: 1; gap: 12px; }
  .draw { order: 3; flex-direction: row; justify-content: space-between; padding-left: 64px; }
  .timer .lbl { display: none; }
}
</style>
</head>
<body data-sport="soccer">

<div class="intro" id="intro" hidden aria-hidden="true">
  <canvas id="arcade" width="192" height="108"></canvas>
  <div class="crt"></div>
  <button class="skip" id="skip" type="button">SKIP &#9654;</button>
  <div class="ovl">
    <div class="hud"><span><span class="r">1UP</span> <span id="sc1">TABET 0</span></span><span>HI-SCORE <span class="r">MARKET</span></span><span><span class="r">2UP</span> 0</span></div>
    <div class="big" id="big"></div>
    <div class="msg"><span id="msg" class="blink">INSERT COIN</span></div>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="./" aria-label="TaBet home">
        <span class="tile"><img src="img/tamid-mark.png" width="34" height="34" alt="TAMID Group at Northeastern"></span>
        <span class="name">TABET</span>
      </a>
      <div class="right">
        <nav class="pages" aria-label="Pages">
          <a href="./" aria-current="page">Matches</a>
          <span aria-disabled="true">Stats <span class="soon">Soon</span></span>
          <a href="notebook">How it works</a>

    var m = x.m, f = x.f, mk = x.mk, h = x.h, a = x.a, p = f ? f.p : [0, 0, 0], favH = p[0] >= p[2];
    return '<div class="reveal"><a class="card" href="' + matchLink(m) + '">' +
      '<span class="strip" aria-hidden="true"><span style="background:' + h.bg + '"></span><span style="background:' + a.bg + '"></span></span>' +
      '<div class="when"><span>' + esc(T.when(m.kickoff, "card")) + "</span>" +
        (x.gap ? '<span class="gaptag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Big gap</span>' : "") + "</div>" +
      '<div class="pair">' +
        '<span class="t">' + badge(h) + (favH ? "<b>" : "<span>") + esc(h.short) + (favH ? "</b>" : "</span>") + "</span>" +
        '<span class="pct' + (favH ? " fav" : "") + '">' + r100(p[0]) + "%</span>" +
        '<span class="t">' + badge(a) + (favH ? "<span>" : "<b>") + esc(a.short) + (favH ? "</span>" : "</b>") + "</span>" +
        '<span class="pct' + (favH ? "" : " fav") + '">' + r100(p[2]) + "%</span>" +
      "</div>" +
      '<div>' + bar(p, x.cols) + '<div class="sub" style="margin-top:8px"><span>Draw ' + r100(p[1]) + "%</span><span>" +
        (mk ? "Market " + r100(mk.p[0]) + " / " + r100(mk.p[1]) + " / " + r100(mk.p[2]) : "No market odds yet") + "</span></div></div>" +
      (x.gap ? '<p class="why">' + esc(x.gap) + "</p>" : "") +
      "</a></div>";
  }
  function renderWeek(gw) {
    var el = document.getElementById("week");
    if (!weekItems.length) { el.innerHTML = ""; return; }
    var nGaps = weekItems.filter(function (x) { return x.gap; }).length;
    var shown = filter === "gaps" ? weekItems.filter(function (x) { return x.gap; }) : weekItems;
    el.innerHTML =
      '<div class="head"><div><div class="kicker"><span class="px">GAMEWEEK ' + esc(gw) + '</span></div><h2 id="week-title">This week’s matches</h2></div>' +
        '<div class="filters">' +
          '<button class="chipbtn" type="button" data-f="all" aria-pressed="' + (filter === "all") + '">All matches (' + weekItems.length + ")</button>" +
          '<button class="chipbtn" type="button" data-f="gaps" aria-pressed="' + (filter === "gaps") + '">Big gaps only (' + nGaps + ")</button>" +
        "</div></div>" +
      '<div class="legend" style="margin:16px 0"><span><i></i>Bar shows home win, draw, away win</span><span><i class="o"></i>Big gap means we differ from the market by ' + GAP + "+ points</span></div>" +
      (shown.length ? '<div class="grid">' + shown.map(matchCard).join("") + "</div>" : '<div class="empty">No big gaps this week: we’re close to the market on every match.</div>');
    Array.prototype.forEach.call(el.querySelectorAll(".chipbtn"), function (b) {
      b.addEventListener("click", function () { filter = b.getAttribute("data-f"); renderWeek(gw); el.querySelector('[data-f="' + filter + '"]').focus(); });
    });
  }

  /* ================= last results ================= */
  function resultCard(x) {
    var m = x.m, h = x.h, a = x.a, i = "HDA".indexOf(m.result);
    var mk = m.market.find(function (q) { return q.key === "close"; }) || x.mk;
    var ours = x.f && i >= 0 ? r100(x.f.p[i]) : null, theirs = mk && i >= 0 ? r100(mk.p[i]) : null;
    var won = ours != null && theirs != null && x.f.p[i] > mk.p[i];
    return '<div class="reveal"><a class="card" href="' + matchLink(m) + '" style="gap:14px">' +
      '<span class="strip" aria-hidden="true"><span style="background:' + h.bg + '"></span><span style="background:' + a.bg + '"></span></span>' +
      '<div class="res"><span class="t">' + badge(h, "sm") + esc(h.code) + '</span><span class="score">' + esc(String(m.score).replace("-", "–")) + '</span><span class="t away">' + esc(a.code) + badge(a, "sm") + "</span></div>" +
      '<span class="sr">' + esc(m.home + " " + m.score + " " + m.away) + "</span>" +
      '<div class="resfoot"><span>Chance we gave this result: <strong>' + (ours != null ? ours + "%" : "n/a") + "</strong>" + (theirs != null ? ", market " + theirs + "%" : "") + "</span>" +
        (ours != null && theirs != null ? '<span class="tag' + (won ? " won" : "") + '">' + (won ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Closer than market' : "Market was closer") + "</span>" : "") +
      "</div></a></div>";
  }
  function renderLast(items, gw) {
    var el = document.getElementById("last");
    if (!items.length) { el.innerHTML = ""; return; }
    var wins = items.filter(function (x) {
      var i = "HDA".indexOf(x.m.result), mk = x.m.market.find(function (q) { return q.key === "close"; }) || x.mk;
      return x.f && mk && i >= 0 && x.f.p[i] > mk.p[i];
    }).length;
    el.innerHTML =
      '<div class="head"><div><div class="kicker"><span class="px">GAMEWEEK ' + esc(gw) + '</span></div><h2 id="last-title">Latest results</h2></div>' +
        '<span class="note">We were closer than the market on <strong>' + wins + " of " + items.length + "</strong></span></div>" +
      '<div class="grid" style="margin-top:16px">' + items.map(resultCard).join("") + "</div>";
  }

  /* ================= search (teams and this season's matches) ================= */
  var all = [];
  var sbtn = document.getElementById("searchbtn"), panel = document.getElementById("search"), q = document.getElementById("q"), hits = document.getElementById("hits");
  sbtn.addEventListener("click", function () {
    var open = panel.hidden;
    panel.hidden = !open; sbtn.setAttribute("aria-expanded", String(open));
    if (open) q.focus();
  });
  panel.addEventListener("keydown", function (e) { if (e.key === "Escape") { panel.hidden = true; sbtn.setAttribute("aria-expanded", "false"); sbtn.focus(); } });
  q.addEventListener("input", function () {
    var s = q.value.trim().toLowerCase();
    if (!s) { hits.innerHTML = '<p class="hint">Try a team like Arsenal, or a short code like LIV.</p>'; return; }
    function match(name) { var t = TM.team(name); return name.toLowerCase().indexOf(s) >= 0 || t.code.toLowerCase().indexOf(s) >= 0 || t.short.toLowerCase().indexOf(s) >= 0; }
    var names = {};
    all.forEach(function (x) { names[x.m.home] = 1; names[x.m.away] = 1; });
    var teams = Object.keys(names).filter(match).sort().slice(0, 6);
    var games = all.filter(function (x) { return match(x.m.home) || match(x.m.away); });
    var upcoming = games.filter(function (x) { return x.m.status !== "played"; }).slice(0, 4);
    var recent = games.filter(function (x) { return x.m.status === "played"; }).slice(-4).reverse();
    games = upcoming.concat(recent);
    if (!teams.length && !games.length) { hits.innerHTML = '<p class="hint">No teams or matches found for “' + esc(q.value.trim()) + '”. Check the spelling, or try a short code like MCI.</p>'; return; }
    var html = "";
    if (teams.length) html += '<h3>TEAMS</h3><div class="hits teams" style="margin:8px 0 14px">' + teams.map(function (n) {
      var t = TM.team(n);
      /* until the stats page exists, a team opens its next match (or its latest one) in the match explorer */
      var theirs = all.filter(function (x) { return x.m.home === n || x.m.away === n; });
      var pick = theirs.filter(function (x) { return x.m.status !== "played"; })[0] || theirs[theirs.length - 1];
      return '<a class="hit" href="' + (pick ? matchLink(pick.m) : "matches") + '"><span class="t">' + badge(t, "sm") + esc(n) + '</span><span class="d">' + (pick && pick.m.status !== "played" ? "Next match" : "Latest match") + "</span></a>";
    }).join("") + "</div>";
    if (games.length) html += '<h3>MATCHES</h3><div class="hits" style="margin-top:8px">' + games.map(function (x) {
      var m = x.m, played = m.status === "played", p = x.f ? x.f.p : null;
      var title = played ? x.h.short + " " + String(m.score).replace("-", "–") + " " + x.a.short : x.h.short + " v " + x.a.short;
      var detail = T.when(m.kickoff, "card") + (played ? ", result" : p ? ", forecast " + r100(p[0]) + " / " + r100(p[1]) + " / " + r100(p[2]) : "");
      return '<a class="hit" href="' + matchLink(m) + '"><span class="t">' + esc(title) + '</span><span class="d">' + esc(detail) + "</span></a>";
    }).join("") + "</div>";
    hits.innerHTML = html;
  });

  /* ================= load the latest season and draw the page ================= */
  T.load().then(function (d) {
    all = d.matches.slice().sort(function (a, b) { return a.kickoff < b.kickoff ? -1 : 1; }).map(enrich);
    var upcoming = all.filter(function (x) { return x.m.status !== "played"; });
    var played = all.filter(function (x) { return x.m.status === "played"; });
    var next = upcoming[0] || null;
    renderNext(next);
    renderSeason(played);
    var gw = next ? next.m.gameweek : null;
    weekItems = gw != null ? upcoming.filter(function (x) { return x.m.gameweek === gw; }) : [];
    renderWeek(gw);
    var lastGw = played.length ? played[played.length - 1].m.gameweek : null;
    renderLast(lastGw != null ? played.filter(function (x) { return x.m.gameweek === lastGw; }) : [], lastGw);
    if (!next && !played.length) document.getElementById("next").innerHTML = '<div class="empty">No matches in this season’s data yet.</div>';
  }).catch(function () {
    document.getElementById("next").innerHTML = '<div class="empty">The match data didn’t load. Refresh the page; if it keeps happening, the data files in site/data may be missing.</div>';
  });
})();
</script>
</body>
</html>
